name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.2'

    - name: Verify Xcode & actool
      run: |
        xcodebuild -version
        xcrun --sdk iphoneos --find actool

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.100'

    - name: Install Matching .NET MAUI iOS Workload
      run: |
        dotnet workload install maui-ios --version 10.0.100

    - name: Build Native App Bundle (Unsigned)
      run: |
        dotnet publish -f net10.0-ios -c Release -r ios-arm64 /p:TargetFrameworks=net10.0-ios /p:ValidateXcodeVersion=false /p:EnableCodeSigning=false

    - name: Package Native IPA
      run: |
        APP_PATH=$(find . -type d -name "AHGroceries.app" | grep "ios-arm64" | head -n 1)
        echo "Found App Bundle at: $APP_PATH"
        mkdir -p build_output/Payload
        cp -R "$APP_PATH" build_output/Payload/
        cd build_output
        zip -r AHGroceries.ipa Payload
        echo "Packaged IPA successfully."

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AHGroceries-IPA
        path: build_output/AHGroceries.ipa
