name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Select Working Xcode Version
      run: |
        echo "Available Xcode installations:"
        ls -ld /Applications/Xcode*
        WORKING_XCODE=""
        for x in $(ls -d /Applications/Xcode_*.app | grep -v "26.3" | sort -V); do
          sudo xcode-select -s "$x"
          if xcrun --find actool >/dev/null 2>&1 && xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            WORKING_XCODE="$x"
          fi
        done
        if [ -z "$WORKING_XCODE" ]; then
          echo "No working Xcode found!"
          exit 1
        fi
        echo "Final selected Xcode: $WORKING_XCODE"
        sudo xcode-select -s "$WORKING_XCODE"
        xcodebuild -version

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.100'

    - name: Install Matching .NET MAUI iOS Workload
      run: |
        dotnet workload install maui-ios --version 10.0.100

    - name: Build Native App Bundle (Unsigned)
      run: |
        dotnet publish -f net10.0-ios -c Release -r ios-arm64 /p:TargetFrameworks=net10.0-ios /p:ValidateXcodeVersion=false /p:EnableCodeSigning=false

    - name: Package Native IPA
      run: |
        APP_PATH=$(find . -type d -name "AHGroceries.app" | grep "ios-arm64" | head -n 1)
        echo "Found App Bundle at: $APP_PATH"
        mkdir -p build_output/Payload
        cp -R "$APP_PATH" build_output/Payload/
        cd build_output
        zip -r AHGroceries.ipa Payload
        echo "Packaged IPA successfully."

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AHGroceries-IPA
        path: build_output/AHGroceries.ipa
